name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: |
          rm -rf android
          flutter create . --project-name zfanz_electronics --org com.zfanz --platforms android --no-pub
          sed -i 's/android:label=".*"/android:label="ZFANZ-ELECTRONICS"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ZFANZ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
